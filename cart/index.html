<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Responsive Shopping Cart</title>
<!-- Normalize CSS for consistency across browsers -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css" />
<style>
  /* Reset & Base Styles */
  body {
    padding: 20px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 300;
    background-color: #f0f2f5;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 {
    text-align: center;
    font-weight: 600;
    margin-bottom: 20px;
    font-size: 2em;
    color: #222;
  }

  /* Main Cart Container */
  .shopping-cart {
    width: 100%;
    max-width: 1100px;
    background: #fff;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
  }

  /* Column Labels */
  .column-labels {
    display: flex;
    border-bottom: 2px solid #ddd;
    padding-bottom: 12px;
    margin-bottom: 20px;
    font-weight: 600;
    font-size: 1em;
    text-align: left;
  }

  .column-labels label {
    flex: 1;
    padding: 0 10px;
    min-width: 80px;
  }

  /* Product Row Styles */
  .product {
    display: flex;
    align-items: center;
    padding: 15px 0;
    border-bottom: 1px solid #eee;
    transition: background 0.2s;
  }

  .product:hover {
    background-color: #fafafa;
  }

  /* Product Image */
  .product-image {
    flex: 0 0 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5px;
  }

  .productImage {
    width: 100%;
    height: 120px;
    background-size: cover;
    background-position: center;
    border-radius: 8px;
  }

  /* Product Details */
  .product-details {
    flex: 2;
    padding: 0 20px;
  }

  .product-title {
    font-weight: 500;
    margin-bottom: 8px;
    font-size: 1.1em;
    color: #222;
  }

  .product-description {
    font-size: 0.85em;
    color: #666;
    line-height: 1.4;
  }

  /* Price */
  .product-price {
    flex: 0.8;
    font-weight: 600;
    font-size: 1.1em;
    padding: 0 10px;
    min-width: 80px;
    text-align: center;
  }

  /* Quantity with custom controls */
  .product-quantity {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .number-control {
    display: inline-flex;
    align-items: center;
    border: 1px solid #ccc;
    border-radius: 8px;
    overflow: hidden;
    width: 100px;
    background-color: #fff;
  }

  .number-control input[type=number] {
    width: 50px;
    padding: 8px;
    border: none;
    text-align: center;
    font-size: 1em;
    outline: none;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    border-left: 1px solid #ccc;
  }

  .buttons button {
    background: #f0f0f0;
    border: none;
    padding: 4px;
    font-size: 1.2em;
    cursor: pointer;
    line-height: 1;
    transition: background 0.2s;
  }

  .buttons button:hover {
    background: #ddd;
  }

  /* Remove Button */
  .remove-product {
    background-color: #e74c3c;
    border: none;
    color: #fff;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9em;
    transition: background 0.2s, transform 0.2s;
  }

  .remove-product:hover {
    background-color: #c0392b;
    transform: scale(1.05);
  }

  /* Total per product */
  .product-line-price {
    flex: 0 0 120px;
    text-align: right;
    font-weight: 600;
    font-size: 1.1em;
    padding: 0 10px;
    min-width: 80px;
  }

  /* Totals Section */
  .totals {
    margin-top: 30px;
    border-top: 2px solid #ddd;
    padding-top: 20px;
  }

  .totals-item {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
    font-size: 1em;
  }

  .totals-item label {
    font-weight: 500;
  }

  .totals-value {
    min-width: 80px;
    text-align: right;
    font-weight: 600;
  }

  /* Grand Total */
  .totals-item-total {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 700;
    font-size: 1.3em;
  }

  /* Checkout Button */
  .checkout {
    display: inline-block;
    background-color: #27ae60;
    color: #fff;
    padding: 15px 30px;
    border: none;
    border-radius: 8px;
    font-size: 1.2em;
    cursor: pointer;
    margin-top: 30px;
    transition: background 0.2s, transform 0.2s;
  }

  .checkout:hover {
    background-color: #219150;
    transform: translateY(-2px);
  }

  /* Responsive styles for smaller screens */
  @media(max-width: 768px){
    .column-labels {
      display: none;
    }
    .product {
      flex-direction: column;
      align-items: flex-start;
    }
    .product-image {
      width: 100%;
      height: auto;
    }
    .product-details {
      width: 100%;
      padding: 0;
    }
    .product-price,
    .product-quantity,
    .product-line-price {
      width: 100%;
      padding: 10px 0;
    }
    .product-quantity {
      justify-content: flex-start;
    }
  }
</style>
</head>
<body>
<h1>Shopping Cart</h1>

<div class="shopping-cart">
  <div class="column-labels">
    <label class="product-image">Image</label>
    <label class="product-details">Product</label>
    <label class="product-price">Price</label>
    <label class="product-quantity">Quantity</label>
    <label class="product-removal">Remove</label>
    <label class="product-line-price">Total</label>
  </div>

  <!-- Product 1 -->
  <div class="product">
    <div class="product-image">
      <div class="productImage" style="background-image: url(https://raw.githubusercontent.com/burzachem/mustytrapstar/gh-pages/images/muztymarch1.jpg);"></div>
    </div>
    <div class="product-details">
      <div class="product-title">Sample Product 1</div>
      <p class="product-description">Description of product 1.</p>
    </div>
    <div class="product-price center">$500.00</div>
    <div class="product-quantity">
      <div class="number-control">
        <input type="number" value="1" min="1" />
        <div class="buttons">
          <button onclick="changeNumber(this, 1)">&#9650;</button>
          <button onclick="changeNumber(this, -1)">&#9660;</button>
        </div>
      </div>
    </div>
    <div class="product-removal">
      <button class="remove-product">Remove</button>
    </div>
    <div class="product-line-price">$500.00</div>
  </div>

  <!-- Product 2 -->
  <div class="product">
    <div class="product-image">
      <div class="productImage" style="background-image: url(https://raw.githubusercontent.com/burzachem/mustytrapstar/gh-pages/images/muztymarch2.jpg);"></div>
    </div>
    <div class="product-details">
      <div class="product-title">Sample Product 2</div>
      <p class="product-description">Description of product 2.</p>
    </div>
    <div class="product-price center">$700.00</div>
    <div class="product-quantity">
      <div class="number-control">
        <input type="number" value="2" min="1" />
        <div class="buttons">
          <button onclick="changeNumber(this, 1)">&#9650;</button>
          <button onclick="changeNumber(this, -1)">&#9660;</button>
        </div>
      </div>
    </div>
    <div class="product-removal">
      <button class="remove-product">Remove</button>
    </div>
    <div class="product-line-price">$40.00</div>
  </div>

  <!-- Totals -->
  <div class="totals">
    <div class="totals-item">
      <label>Subtotal</label>
      <div class="totals-value" id="cart-subtotal">$50.00</div>
    </div>
    <div class="totals-item">
      <label>Tax (5%)</label>
      <div class="totals-value" id="cart-tax">$2.50</div>
    </div>
    <div class="totals-item">
      <label>Shipping</label>
      <div class="totals-value" id="cart-shipping">$10.00</div>
    </div>
    <div class="totals-item totals-item-total">
      <label>Grand Total</label>
      <div class="totals-value" id="cart-total">$62.50</div>
    </div>
  </div>

  <!-- Checkout Button -->
  <a href="#"><button class="checkout">Checkout</button></a>
</div>

<!-- PayPal Button Container -->
<div id="paypal-button-container"></div>

<!-- jQuery and PayPal SDK -->
<script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
<script src="https://www.paypal.com/sdk/js?client-id=YOUR_CLIENT_ID"></script>
<script>
  var fadeTime = 300;

  function changeNumber(button, delta) {
    const input = button.closest('.number-control').querySelector('input[type=number]');
    let currentValue = parseInt(input.value);
    if (isNaN(currentValue)) currentValue = 0;
    const min = parseInt(input.min) || -Infinity;
    const max = parseInt(input.max) || Infinity;
    let newValue = currentValue + delta;
    if (newValue < min) newValue = min;
    if (newValue > max) newValue = max;
    input.value = newValue;
    input.dispatchEvent(new Event('change'));
  }

  function recalculateCart() {
    var subtotal = 0;
    document.querySelectorAll('.product').forEach(function(product) {
      var linePriceText = product.querySelector('.product-line-price').innerText;
      var linePrice = parseFloat(linePriceText.replace('$',''));
      subtotal += linePrice;
    });
    var tax = subtotal * 0.16;
    var shipping = subtotal > 0 ? 10 : 0;
    var total = subtotal + tax + shipping;

    document.getElementById('cart-subtotal').innerText = '$' + subtotal.toFixed(2);
    document.getElementById('cart-tax').innerText = '$' + tax.toFixed(2);
    document.getElementById('cart-shipping').innerText = '$' + shipping.toFixed(2);
    document.getElementById('cart-total').innerText = '$' + total.toFixed(2);

    if (total === 0) {
      document.querySelector('.checkout').style.display = 'none';
    } else {
      document.querySelector('.checkout').style.display = 'inline-block';
    }
  }

  function updateQuantity(input) {
    const product = input.closest('.product');
    const priceText = product.querySelector('.product-price').innerText;
    const price = parseFloat(priceText.replace('$',''));
    const quantity = parseInt(input.value);
    const linePrice = price * quantity;
    product.querySelector('.product-line-price').innerText = '$' + linePrice.toFixed(2);
    recalculateCart();
  }

  document.querySelectorAll('.product-quantity input').forEach(function(input) {
    input.addEventListener('change', function() {
      updateQuantity(this);
    });
  });

  document.querySelectorAll('.remove-product').forEach(function(btn) {
    btn.addEventListener('click', function() {
      const row = this.closest('.product');
      row.remove();
      recalculateCart();
    });
  });

  // Initialize PayPal Button
  paypal.Buttons({
    createOrder: function(data, actions) {
      return actions.order.create({
        purchase_units: [{
          amount: { value: document.getElementById('cart-total').innerText.replace('$','') }
        }]
      });
    },
    onApprove: function(data, actions) {
      return actions.order.capture().then(function(details) {
        alert('Transaction completed by ' + details.payer.name.given_name);
      });
    }
  }).render('#paypal-button-container');

  // Initialize cart total on page load
  recalculateCart();
</script>
</body>
</html>
