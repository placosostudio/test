<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Responsive Shopping Cart</title>
<!-- Normalize CSS for consistency across browsers -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css" />
<style>
  /* Reset & Base Styles */
  body {
    padding: 20px 40px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 300;
    background-color: #f9f9f9;
    color: #333;
  }

  h1 {
    text-align: center;
    font-weight: 300;
    margin-bottom: 30px;
    font-size: 2em;
  }

  /* Shopping Cart Container */
  .shopping-cart {
    max-width: 1200px;
    margin: 0 auto;
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  }

  /* Column Labels */
  .column-labels {
    display: flex;
    border-bottom: 2px solid #ddd;
    padding-bottom: 10px;
    margin-bottom: 20px;
    font-weight: 600;
    font-size: 0.95em;
  }

  .column-labels label {
    flex: 1;
    padding: 0 10px;
    text-align: left;
  }

  /* Product Row */
  .product {
    display: flex;
    align-items: center;
    padding: 15px 0;
    border-bottom: 1px solid #eee;
    transition: background 0.2s;
  }

  .product:hover {
    background-color: #fafafa;
  }

  /* Product Image with background-image */
  .product-image {
    flex: 0 0 100px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .productImage {
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    border-radius: 4px;
  }

  /* Product Details */
  .product-details {
    flex: 2;
    padding: 0 15px;
  }

  .product-title {
    font-weight: 500;
    margin-bottom: 8px;
  }

  .product-description {
    font-size: 0.85em;
    color: #666;
    line-height: 1.4;
  }

  /* Price */
  .product-price {
    flex: 0.8;
    font-weight: 600;
    font-size: 1.1em;
    padding: 0 10px;
  }

  /* Quantity */
  .product-quantity {
    flex: 0.8;
    padding: 0 10px;
  }

  /* Custom number input with arrows */
  .number-input-container {
    display: inline-flex;
    align-items: center;
    border: 1px solid #ccc;
    border-radius: 4px;
    overflow: hidden;
  }

  .number-input-container input[type="number"] {
    width: 60px;
    padding: 6px;
    border: none;
    outline: none;
    text-align: center;
  }

  .quantity-buttons {
    display: flex;
    flex-direction: column;
  }

  .quantity-buttons button {
    background: #f0f0f0;
    border: none;
    padding: 2px 6px;
    cursor: pointer;
    font-size: 0.8em;
  }

  /* Remove Button */
  .remove-product {
    background-color: #e74c3c;
    border: none;
    color: #fff;
    padding: 8px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.9em;
    transition: background-color 0.2s, transform 0.2s;
  }

  .remove-product:hover {
    background-color: #c0392b;
    transform: scale(1.05);
  }

  /* Total per product */
  .product-line-price {
    flex: 1;
    text-align: right;
    font-weight: 600;
    font-size: 1.1em;
    padding: 0 10px;
  }

  /* Totals Section */
  .totals {
    margin-top: 30px;
    border-top: 2px solid #ddd;
    padding-top: 20px;
  }

  .totals-item {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
    font-size: 1em;
  }

  .totals-item label {
    font-weight: 500;
  }

  .totals-value {
    min-width: 80px;
    text-align: right;
    font-weight: 600;
  }

  /* Grand Total */
  .totals-item-total {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 700;
    font-size: 1.2em;
  }

  /* Checkout Button */
  .checkout {
    display: inline-block;
    background-color: #27ae60;
    color: #fff;
    padding: 14px 28px;
    border: none;
    border-radius: 4px;
    font-size: 1.2em;
    cursor: pointer;
    margin-top: 30px;
    transition: background-color 0.2s, transform 0.2s;
  }

  .checkout:hover {
    background-color: #219150;
    transform: translateY(-2px);
  }

  /* Responsive Styles */
  @media (max-width: 768px) {
    .column-labels {
      display: none;
    }

    .product {
      flex-direction: column;
      align-items: flex-start;
    }
    /* ... other responsive styles ... */
  }

  /* Additional styles for custom controls */
  @media(max-width: 768px){
    /* Make sure the custom control is inline for small screens */
    .number-input-container {
      display: inline-flex;
    }
  }
</style>
</head>
<body>
<h1>Shopping Cart</h1>

<div class="shopping-cart">
  <div class="column-labels">
    <label class="product-image">Image</label>
    <label class="product-details">Product</label>
    <label class="product-price">Price</label>
    <label class="product-quantity">Quantity</label>
    <label class="product-removal">Remove</label>
    <label class="product-line-price">Total</label>
  </div>

  <!-- Product 1 -->
  <div class="product">
    <div class="product-image">
      <div class="productImage" style="background-image: url(https://raw.githubusercontent.com/burzachem/mustytrapstar/gh-pages/images/muztymarch1.jpg); background-size: cover; background-position: center; width: 200px; height: 200px; border-radius: 4px;"></div>
    </div>
    <div class="product-details">
      <div class="product-title">Sample Product 1</div>
      <p class="product-description">Description of product 1.</p>
    </div>
    <div class="product-price center">$10.00</div>
    <div class="product-quantity">
      <!-- Custom Number Input with Buttons -->
      <div class="number-input-container">
        <input type="number" value="1" min="1" />
        <div class="quantity-buttons">
          <button onclick="changeNumber(this, 1)">&#9650;</button>
          <button onclick="changeNumber(this, -1)">&#9660;</button>
        </div>
      </div>
    </div>
    <div class="product-removal">
      <button class="remove-product">Remove</button>
    </div>
    <div class="product-line-price center">$10.00</div>
  </div>

  <!-- Product 2 -->
  <div class="product">
    <div class="product-image">
      <div class="productImage" style="background-image: url(https://raw.githubusercontent.com/burzachem/mustytrapstar/gh-pages/images/muztymarch2.jpg); background-size: cover; background-position: center; width: 200px; height: 200px; border-radius: 4px;"></div>
    </div>
    <div class="product-details center">
      <div class="product-title center">Sample Product 2</div>
      <p class="product-description">Description of product 2.</p>
    </div>
    <div class="product-price center">$20.00</div>
    <div class="product-quantity">
      <div class="number-input-container">
        <input type="number" value="2" min="1" />
        <div class="quantity-buttons">
          <button onclick="changeNumber(this, 1)">&#9650;</button>
          <button onclick="changeNumber(this, -1)">&#9660;</button>
        </div>
      </div>
    </div>
    <div class="product-removal">
      <button class="remove-product">Remove</button>
    </div>
    <div class="product-line-price center">$40.00</div>
  </div>

  <!-- Totals -->
  <div class="totals">
    <div class="totals-item">
      <label>Subtotal</label>
      <div class="totals-value" id="cart-subtotal">$50.00</div>
    </div>
    <div class="totals-item">
      <label>Tax (5%)</label>
      <div class="totals-value" id="cart-tax">$2.50</div>
    </div>
    <div class="totals-item">
      <label>Shipping</label>
      <div class="totals-value" id="cart-shipping">$10.00</div>
    </div>
    <div class="totals-item totals-item-total">
      <label>Grand Total</label>
      <div class="totals-value" id="cart-total">$62.50</div>
    </div>
  </div>

  <!-- Checkout Button -->
 
<a href="../shipping/step1.html"><button class="checkout">Checkout</button></a>
</div>

<!-- PayPal Button Container -->
<div id="paypal-button-container"></div>

<!-- JS for handling quantity controls -->
<script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
<script src="https://www.paypal.com/sdk/js?client-id=YOUR_CLIENT_ID"></script>
<script>
  var fadeTime = 300;

  // Function to change number with custom buttons
  function changeNumber(button, delta) {
    const input = button.closest('.number-input-container').querySelector('input[type=number]');
    let currentValue = parseInt(input.value);
    if (isNaN(currentValue)) currentValue = 0;
    const min = parseInt(input.min) || -Infinity;
    const max = parseInt(input.max) || Infinity;
    let newValue = currentValue + delta;
    if (newValue < min) newValue = min;
    if (newValue > max) newValue = max;
    input.value = newValue;
    input.dispatchEvent(new Event('change'));
  }

  // Recalculate totals when quantity changes
  $('.product-quantity input').change(function() {
    updateQuantity(this);
  });

  // Remove product
  $('.remove-product').click(function() {
    removeItem(this);
  });

  function recalculateCart() {
    var subtotal = 0;
    $('.product').each(function() {
      var linePrice = parseFloat($(this).children('.product-line-price').text().replace('$',''));
      subtotal += linePrice;
    });
    var tax = subtotal * 0.05;
    var shipping = subtotal > 0 ? 10 : 0;
    var total = subtotal + tax + shipping;

    $('#cart-subtotal').fadeOut(fadeTime, function() {
      $(this).text('$' + subtotal.toFixed(2));
      $(this).fadeIn(fadeTime);
    });
    $('#cart-tax').fadeOut(fadeTime, function() {
      $(this).text('$' + tax.toFixed(2));
      $(this).fadeIn(fadeTime);
    });
    $('#cart-shipping').fadeOut(fadeTime, function() {
      $(this).text('$' + shipping.toFixed(2));
      $(this).fadeIn(fadeTime);
    });
    $('#cart-total').fadeOut(fadeTime, function() {
      $(this).text('$' + total.toFixed(2));
      $(this).fadeIn(fadeTime);
      if (total === 0) {
        $('.checkout').fadeOut(fadeTime);
      } else {
        $('.checkout').fadeIn(fadeTime);
      }
    });
  }

  function updateQuantity(input) {
    const productRow = $(input).closest('.product');
    const price = parseFloat(productRow.children('.product-price').text().replace('$',''));
    const quantity = parseInt($(input).val());
    const linePrice = price * quantity;
    productRow.children('.product-line-price').fadeOut(fadeTime, function() {
      $(this).text('$' + linePrice.toFixed(2));
      recalculateCart();
      $(this).fadeIn(fadeTime);
    });
  }

  function removeItem(button) {
    var row = $(button).closest('.product');
    row.slideUp(fadeTime, function() {
      $(this).remove();
      recalculateCart();
    });
  }

  // Initialize PayPal button
  $(function() {
    recalculateCart();

    paypal.Buttons({
      createOrder: function(data, actions) {
        return actions.order.create({
          purchase_units: [{
            amount: { value: $('#cart-total').text().replace('$','') }
          }]
        });
      },
      onApprove: function(data, actions) {
        return actions.order.capture().then(function(details) {
          alert('Transaction completed by ' + details.payer.name.given_name);
        });
      }
    }).render('#paypal-button-container');
  });
</script>
</body>
</html>
